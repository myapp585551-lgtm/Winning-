name: Build Winner Balance APK & Deploy Public Web Portal

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK (API 36.1)
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 36.1 & Build Tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36.1" "platforms;android-36" "build-tools;36.0.0"

      - name: Generate debug.keystore for CI if absent
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Assemble Debug APK
        run: gradle :app:assembleDebug

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Winner-Balance-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  deploy-public-web:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare refresh-safe static bundle with 404 fallback and banner assets
        run: |
          mkdir -p dist/assets dist/.well-known
          cp web/index.html dist/index.html
          cp web/index.html dist/404.html
          cp app/src/main/res/drawable/img_launcher_bangkok.png dist/assets/logo.png
          cp app/src/main/res/drawable/img_main_hero_banner.jpg dist/assets/hero.jpg
          cp app/src/main/res/drawable/img_promo_banner_1.jpg dist/assets/promo1.jpg
          cp app/src/main/res/drawable/img_promo_banner_2.jpg dist/assets/promo2.jpg
          cp app/src/main/res/drawable/img_promo_banner_3.jpg dist/assets/promo3.jpg

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
